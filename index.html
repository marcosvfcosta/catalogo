<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <script>
      // Ícone na Tela de Início: na Negociação abre a Negociação; no resto abre o catálogo
      (function () {
        var neg = location.pathname.indexOf('/negociacao') === 0
        document.write(
          (location.pathname === '/' ? '' : '<meta name="theme-color" content="#050505" />') +
          '<link rel="manifest" href="' + (neg ? '/manifest-negociacao.webmanifest' : '/manifest.webmanifest') + '" />' +
          '<meta name="apple-mobile-web-app-title" content="' + (neg ? 'Negociação' : 'Marcos Magazine') + '" />' +
          // Catálogo abre já com fundo branco (sem piscar a tela escura)
          (location.pathname === '/' ?
            '<meta name="theme-color" content="#ffffff" /><style>html,body{background:#fff!important;margin:0}</style>' : '')
        )
      })()
    </script>
    <title>Marcos Magazine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
