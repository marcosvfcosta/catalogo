<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <script>
      // Ícone na Tela de Início: cada tela abre nela mesma (Negociação, Admin); no resto abre o catálogo
      (function () {
        var caminho = location.pathname
        var neg = caminho.indexOf('/negociacao') === 0
        var adm = caminho.indexOf('/admin') === 0
        var manifesto = neg ? '/manifest-negociacao.webmanifest' : adm ? '/manifest-admin.webmanifest' : '/manifest.webmanifest'
        var nome = neg ? 'Negociação' : adm ? 'Admin' : 'Marcos Magazine'
        document.write(
          (caminho === '/' ? '' : '<meta name="theme-color" content="#050505" />') +
          '<link rel="manifest" href="' + manifesto + '" />' +
          '<meta name="apple-mobile-web-app-title" content="' + nome + '" />' +
          // Catálogo abre já com fundo branco (sem piscar a tela escura)
          (caminho === '/' ?
            '<meta name="theme-color" content="#ffffff" /><style>html,body{background:#fff!important;margin:0}</style>' : '')
        )
      })()
    </script>
    <title>Marcos Magazine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
